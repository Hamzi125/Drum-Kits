<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="A web drum kit: play with your keyboard or touch, record beats, use a metronome and switch kits.">
    <title>Drum Kit</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="top">
        <h1>Drum Kit</h1>

        <div class="controls">
            <label class="control">
                <span>Kit</span>
                <select id="kit">
                    <option value="acoustic">Acoustic</option>
                    <option value="electronic">Electronic</option>
                    <option value="percussion">Percussion</option>
                </select>
            </label>

            <label class="control">
                <span>Volume</span>
                <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
            </label>

            <div class="control group">
                <button id="metro-toggle" type="button" class="btn" aria-pressed="false">Metronome</button>
                <label class="bpm">
                    <input id="bpm" type="number" min="40" max="240" value="100" aria-label="Tempo in BPM">
                    <span>BPM</span>
                </label>
            </div>

            <div class="control group">
                <button id="rec" type="button" class="btn rec" aria-pressed="false">● Record</button>
                <button id="play" type="button" class="btn" disabled>▶ Play</button>
                <label class="loop">
                    <input id="loop" type="checkbox">
                    <span>Loop</span>
                </label>
                <button id="clear" type="button" class="btn" disabled>Clear</button>
            </div>
        </div>
        <p id="status" class="status" role="status"></p>
    </header>

    <main class="keys" id="keys" aria-label="Drum pads"></main>

    <p class="hint">Press the keys on your keyboard, or tap the pads.</p>
</body>
</html>
